name: build & boot

on:
  push:
  pull_request:

jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y nasm gcc-multilib qemu-system-x86
      - name: Build
        run: make
      - name: Boot smoke test (QEMU)
        run: make test
